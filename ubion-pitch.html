<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ubion — Présentation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Nunito:wght@800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.34.0/iconfont/tabler-icons.min.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0D0B08}
body{font-family:'Inter',system-ui,sans-serif}

#deck{position:relative;width:100vw;height:100vh;overflow:hidden}

/* PROGRESS */
#prog-wrap{position:absolute;top:0;left:0;right:0;height:3px;z-index:300}
#prog{height:100%;width:0;background:#C87E20;transition:width .12s linear}

/* LOGO BAR */
#logo-bar{
  position:absolute;top:0;left:0;right:0;z-index:200;
  display:flex;align-items:center;justify-content:space-between;
  padding:1.4rem 2.5rem;pointer-events:none
}
.logo{display:flex;align-items:center;gap:10px}
.logo-mark{width:38px;height:38px;display:block;flex-shrink:0}
.hero-mark{width:96px;height:96px;margin-bottom:1.75rem;flex-shrink:0;display:block}
.cta-mark{width:84px;height:84px;margin-bottom:1.5rem;flex-shrink:0;display:block}
/* Logo colour switching per theme */
.dk .logo-lm-cop,.br .logo-lm-cop{display:none}
.lt .logo-lm-wht{display:none}

.logo-word{font-size:1.1rem;font-weight:800;letter-spacing:-0.04em;transition:color .4s;font-family:'Nunito',system-ui}
.chapter-pill{
  font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;
  padding:5px 12px;border-radius:20px;transition:all .4s;opacity:0
}

/* DECK THEMING */
.dk .logo-word{color:#fff}.dk .chapter-pill{color:rgba(255,255,255,.5);background:rgba(255,255,255,.08);opacity:1}
.dk #slide-num{color:rgba(255,255,255,.25)}.dk .dot:not(.on){background:rgba(255,255,255,.18)}
.dk .nav-btn{background:rgba(255,255,255,.09);color:rgba(255,255,255,.55)}
.dk .nav-btn:hover{background:rgba(255,255,255,.18);color:#fff}
.lt .logo-word{color:#1A1510}.lt .chapter-pill{color:rgba(26,21,16,.4);background:rgba(0,0,0,.07);opacity:1}
.lt #slide-num{color:rgba(0,0,0,.2)}.lt .dot:not(.on){background:rgba(0,0,0,.15)}
.lt .nav-btn{background:rgba(0,0,0,.06);color:rgba(0,0,0,.35)}.lt .nav-btn:hover{background:rgba(0,0,0,.12);color:#000}
.br .logo-word{color:#fff}.br .chapter-pill{color:rgba(255,255,255,.7);background:rgba(255,255,255,.2);opacity:1}
.br #slide-num{color:rgba(255,255,255,.4)}.br .dot:not(.on){background:rgba(255,255,255,.3)}
.br .nav-btn{background:rgba(255,255,255,.15);color:rgba(255,255,255,.7)}.br .nav-btn:hover{background:rgba(255,255,255,.25);color:#fff}

/* SLIDES */
#slides{position:relative;width:100%;height:100%}
.slide{position:absolute;inset:0;display:flex;align-items:stretch;opacity:0;transform:translateX(40px);transition:opacity .5s ease,transform .5s ease;pointer-events:none}
.slide.on{opacity:1;transform:none;pointer-events:auto}

/* HERO */
.slide-hero{background:#0D0B08;align-items:center;justify-content:center;flex-direction:column;text-align:center}
.hero-mark svg{width:100%;height:100%;display:block}
.hero-brand{font-size:4.2rem;font-weight:800;color:#fff;letter-spacing:-.05em;margin-bottom:.75rem;font-family:'Nunito',system-ui}
.hero-tagline{font-size:1.2rem;color:rgba(255,255,255,.55);font-weight:400;margin-bottom:.4rem;max-width:460px;line-height:1.5}
.hero-sub{font-size:.85rem;color:rgba(255,255,255,.2);letter-spacing:.01em}
.hero-hint{margin-top:3.5rem;font-size:.8rem;color:rgba(255,255,255,.18);display:flex;align-items:center;gap:7px}

/* PROBLEM SLIDES */
.slide-problem{background:#0D0B08}
.p-left{flex:1;padding:5.5rem 3rem 4rem 7rem;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
.p-deco{position:absolute;right:-.1em;top:50%;transform:translateY(-50%);font-size:17rem;font-weight:700;color:#C87E20;opacity:.033;line-height:1;letter-spacing:-.06em;pointer-events:none;user-select:none}
.p-label{font-size:11px;font-weight:600;color:#C87E20;text-transform:uppercase;letter-spacing:.1em;margin-bottom:1.4rem}
.p-stat{font-size:7rem;font-weight:700;color:#fff;letter-spacing:-.04em;line-height:1;margin-bottom:.4rem}
.p-stat-sub{font-size:.95rem;color:rgba(255,255,255,.38);margin-bottom:2rem;max-width:300px;line-height:1.55}
.p-headline{font-size:1.75rem;font-weight:600;color:#fff;line-height:1.2;letter-spacing:-.02em;margin-bottom:.75rem}
.p-desc{font-size:.9rem;color:rgba(255,255,255,.42);line-height:1.8;max-width:400px}
.p-right{width:44%;flex-shrink:0;padding:5rem 4rem 4rem 2rem;display:flex;align-items:center;justify-content:center}

/* CHARTS */
.c-title{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.22);margin-bottom:20px}
.c-timebars{width:100%}
.tb-row{margin-bottom:18px}
.tb-meta{display:flex;justify-content:space-between;margin-bottom:7px}
.tb-meta span:first-child{font-size:12.5px;color:rgba(255,255,255,.38)}
.tb-meta span:last-child{font-size:12.5px;font-weight:600;color:rgba(255,255,255,.62)}
.tb-track{height:10px;background:rgba(255,255,255,.06);border-radius:5px;overflow:hidden}
.tb-fill{height:100%;border-radius:5px;width:0}
.c-donut-wrap{position:relative;width:210px;height:210px}
.c-donut-wrap svg{width:100%;height:100%;overflow:visible}
.donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.donut-num{font-size:2.8rem;font-weight:700;color:#fff;letter-spacing:-.04em;line-height:1}
.donut-sub{font-size:.7rem;color:rgba(255,255,255,.33);margin-top:5px;text-align:center;max-width:88px;line-height:1.4}
.donut-note{font-size:11px;color:rgba(255,255,255,.2);margin-top:1.2rem;text-align:center;max-width:200px;line-height:1.6}
.c-waste{width:100%}
.waste-track{height:52px;border-radius:10px;background:rgba(255,255,255,.05);position:relative;overflow:hidden;margin-bottom:13px}
.waste-useful{position:absolute;left:0;top:0;bottom:0;width:0;background:#3B6D11;border-radius:10px 0 0 10px;display:flex;align-items:center;padding-left:14px;font-size:13px;font-weight:600;color:rgba(255,255,255,.7);white-space:nowrap;overflow:hidden}
.waste-lost{position:absolute;right:0;top:0;bottom:0;width:0;background:rgba(196,60,44,.72);border-radius:0 10px 10px 0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:rgba(255,255,255,.85)}
.waste-legend{display:flex;justify-content:space-between;font-size:11.5px;color:rgba(255,255,255,.22)}
.waste-insight{margin-top:18px;padding:12px 16px;border-radius:8px;background:rgba(196,60,44,.1);border:.5px solid rgba(196,60,44,.18)}
.waste-insight p{font-size:12px;color:rgba(255,255,255,.42);line-height:1.6}
.waste-insight strong{color:rgba(255,255,255,.62)}
.c-compliance{width:100%}
.cgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:14px}
.cg{height:44px;border-radius:8px;display:flex;align-items:center;justify-content:center;opacity:0;transform:scale(.75)}
.cg.ok{background:rgba(59,109,17,.22)}.cg.ok i{color:#5E8F2A;font-size:17px}
.cg.nok{background:rgba(196,60,44,.25)}.cg.nok i{color:#D34B38;font-size:17px}
.c-compliance p{font-size:11.5px;color:rgba(255,255,255,.28);line-height:1.6}
.c-compliance strong{color:rgba(255,255,255,.48)}

/* TRANSITION */
.slide-transition{background:#C87E20;align-items:center;justify-content:center;flex-direction:column;text-align:center}
.trans-eye{font-size:12px;font-weight:500;color:rgba(255,255,255,.6);text-transform:uppercase;letter-spacing:.12em;margin-bottom:1.5rem}
.trans-title{font-size:4.8rem;font-weight:700;color:#fff;letter-spacing:-.05em;line-height:1;margin-bottom:1.5rem}
.trans-desc{font-size:1.05rem;color:rgba(255,255,255,.75);max-width:500px;line-height:1.7;margin-bottom:2.5rem}
.trans-pills{display:flex;gap:.75rem;flex-wrap:wrap;justify-content:center}
.trans-pill{padding:8px 16px;border-radius:20px;font-size:12.5px;font-weight:500;border:1.5px solid rgba(255,255,255,.35);color:rgba(255,255,255,.75)}

/* SOLUTION SLIDES */
.slide-solution{background:#FAFAF8}
.s-left{flex:1;padding:5.5rem 3rem 4rem 7rem;display:flex;flex-direction:column;justify-content:center}
.s-right{width:40%;flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2.5rem 3rem;gap:1.25rem}
.sol-tag{display:inline-flex;align-items:center;gap:8px;padding:7px 16px;border-radius:24px;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;margin-bottom:1.1rem;width:fit-content}
.sol-ref{font-size:11.5px;color:#AAA;margin-bottom:1.1rem;display:flex;align-items:center;gap:6px}
.sol-title{font-size:2.2rem;font-weight:700;color:#1A1510;line-height:1.15;letter-spacing:-.03em;margin-bottom:.85rem}
.sol-desc{font-size:.9rem;color:#666;line-height:1.8;margin-bottom:1.6rem;max-width:390px}
.sol-feats{display:flex;flex-direction:column;gap:10px}
.sol-feat{display:flex;align-items:center;gap:10px;font-size:13.5px;color:#333;font-weight:500}
.feat-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
/* Before/After card */
.sol-ba{width:100%;border-radius:12px;overflow:hidden;border:.5px solid #E8E8E3}
.ba-b{padding:12px 16px;border-bottom:.5px solid #E8E8E3;background:#FEF2F2}
.ba-a{padding:12px 16px;background:#F0FDF4}
.ba-lbl{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px}
.ba-b .ba-lbl{color:#B94040}.ba-a .ba-lbl{color:#297A35}
.ba-txt{font-size:12.5px;color:#444;line-height:1.5}

/* APP MOCKUPS */
.mock{background:white;border-radius:12px;width:100%;overflow:hidden;border:.5px solid rgba(0,0,0,.07)}
.mock-header{padding:10px 14px;border-bottom:.5px solid #f0ede8;display:flex;align-items:center;justify-content:space-between}
.mock-title{font-size:11.5px;font-weight:700;color:#1a1510}
.mock-sub{font-size:10px;color:#999}
.mock-body{padding:12px 14px}
.mock-kpis{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:12px}
.mock-kpi{padding:9px 11px;border-radius:9px;background:#fafaf8}
.mk-lbl{font-size:10px;color:#999;margin-bottom:2px}
.mk-val{font-size:1.4rem;font-weight:700;line-height:1}
.mock-row{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:.5px solid #f5f3f0}
.mock-row:last-child{border-bottom:none}
.mock-row-name{font-size:12.5px;font-weight:600;color:#1a1510}
.mock-row-badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px}
/* Floor plan */
.fp-grid{display:grid;gap:6px;padding:12px 14px}
.fp-table{border-radius:8px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2px}
.fp-num{font-size:10px;font-weight:700}
.fp-pax{font-size:9px;opacity:.7}
/* Recipe cost */
.rc-table{width:100%;font-size:11.5px;border-collapse:collapse}
.rc-table th{text-align:left;padding:5px 4px;color:#999;font-weight:700;text-transform:uppercase;font-size:9.5px;border-bottom:.5px solid #f0ede8}
.rc-table td{padding:6px 4px;border-bottom:.5px solid #f8f6f3;color:#333}
.rc-table tr:last-child td{border-bottom:none}
.rc-total{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:#f8f6f3;border-radius:8px;margin-top:8px}
.rc-margin{padding:7px 10px;background:#f0fdf4;border-radius:8px;display:flex;justify-content:space-between;align-items:center}
/* Stock list */
.stock-item{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:.5px solid #f5f3f0}
.stock-item:last-child{border-bottom:none}
.stock-bar-wrap{flex:1;height:5px;background:#f0ede8;border-radius:3px;overflow:hidden}
.stock-bar{height:100%;border-radius:3px}

/* CTA */
.slide-cta{background:#0D0B08;align-items:center;justify-content:center;flex-direction:column;text-align:center}
.cta-mark svg{width:100%;height:100%;display:block}
.cta-brand{font-size:3.2rem;font-weight:800;color:#fff;letter-spacing:-.05em;margin-bottom:.75rem;font-family:'Nunito',system-ui}
.cta-tagline{font-size:1rem;color:rgba(255,255,255,.5);max-width:460px;line-height:1.7;margin-bottom:2rem}
.cta-url{font-size:1.4rem;font-weight:700;color:#C87E20;letter-spacing:-.02em}
.cta-sub{font-size:.8rem;color:rgba(255,255,255,.18);margin-top:.75rem;letter-spacing:.04em;text-transform:uppercase}

/* NAV */
#nav-dots{position:absolute;bottom:1.75rem;left:50%;transform:translateX(-50%);display:flex;gap:7px;z-index:100}
.dot{height:6px;border-radius:3px;width:6px;cursor:pointer;transition:all .25s;border:none}
.dot.on{background:#C87E20;width:18px}
.nav-btn{position:absolute;top:50%;transform:translateY(-50%);z-index:100;width:42px;height:42px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;border:none;transition:all .2s}
#btn-p{left:1.5rem}#btn-n{right:1.5rem}
#slide-num{position:absolute;bottom:1.85rem;right:2.5rem;font-size:11.5px;font-weight:500;z-index:100;transition:color .4s}

/* ══════════════════════════════════
   BRAND SLIDES
══════════════════════════════════ */
.slide-brand,.slide-brand-out{
  background:#0D0B08;align-items:center;justify-content:center;
  flex-direction:column;text-align:center;position:relative;overflow:hidden
}

/* Ambient copper glow */
.b-glow{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:420px;height:420px;border-radius:50%;
  background:radial-gradient(circle,rgba(200,126,32,.22) 0%,transparent 68%);
  pointer-events:none
}

/* Expanding rings */
@keyframes bRing{
  0%{transform:translate(-50%,-50%) scale(.3);opacity:.75}
  100%{transform:translate(-50%,-50%) scale(3.4);opacity:0}
}
.b-ring{
  position:absolute;top:50%;left:50%;width:180px;height:180px;
  border-radius:50%;border:1.5px solid rgba(200,126,32,.4);
  pointer-events:none;transform:translate(-50%,-50%)
}
.b-ring:nth-child(1){animation:bRing 3.2s ease-out 0s infinite}
.b-ring:nth-child(2){animation:bRing 3.2s ease-out 1.05s infinite}
.b-ring:nth-child(3){animation:bRing 3.2s ease-out 2.1s infinite}

/* Brand intro animations */
@keyframes bMark{
  0%{opacity:0;transform:scale(2.1);filter:blur(22px)}
  55%{opacity:1;transform:scale(.96);filter:blur(0)}
  75%{transform:scale(1.04)}
  100%{opacity:1;transform:scale(1);filter:blur(0)}
}
@keyframes bWord{
  0%{opacity:0;letter-spacing:.55em}
  100%{opacity:1;letter-spacing:-.05em}
}
@keyframes bFade{
  from{opacity:0;transform:translateY(12px)}
  to{opacity:1;transform:translateY(0)}
}

/* Brand animation container (full SVG logo) */
.brand-anim-container{
  width:460px;max-width:88vw;position:relative;z-index:2;flex-shrink:0
}
.brand-anim-svg{width:100%;height:auto;overflow:visible;display:block}

.brand-mark{width:148px;height:148px;position:relative;z-index:2;flex-shrink:0}
.brand-mark svg{width:100%;height:100%;display:block}
.brand-mark.go{animation:bMark 1.3s cubic-bezier(.34,1.4,.64,1) .1s both}

.brand-word{
  font-size:5.5rem;font-weight:700;color:#fff;letter-spacing:-.05em;
  position:relative;z-index:2;margin-top:1.3rem;line-height:1
}
.brand-word.go{animation:bWord 1s cubic-bezier(.4,0,.2,1) .85s both;opacity:0}

.brand-tagline{
  font-size:.98rem;color:rgba(255,255,255,.38);position:relative;
  z-index:2;margin-top:.8rem;letter-spacing:.01em;max-width:380px;line-height:1.6
}
.brand-tagline.go{animation:bFade .9s ease 1.55s both;opacity:0}

.brand-skip{
  position:absolute;bottom:2.5rem;font-size:11px;color:rgba(255,255,255,.15);
  letter-spacing:.08em;text-transform:uppercase;z-index:3
}

/* Brand outro */
@keyframes bOutGlow{
  0%,100%{opacity:.38;transform:translate(-50%,-50%) scale(1)}
  50%{opacity:.72;transform:translate(-50%,-50%) scale(1.18)}
}
@keyframes bOutHalo{
  from{transform:translate(-50%,-50%) rotate(0deg)}
  to{transform:translate(-50%,-50%) rotate(360deg)}
}
@keyframes bOutMark{
  0%{opacity:0;transform:scale(.65)}
  60%{transform:scale(1.06)}
  100%{opacity:1;transform:scale(1)}
}
@keyframes bOutCopper{
  0%{opacity:0;transform:translateY(20px)}
  100%{opacity:1;transform:translateY(0)}
}

.bout-glow{
  position:absolute;top:50%;left:50%;width:440px;height:440px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(200,126,32,.32) 0%,rgba(155,80,30,.1) 40%,transparent 70%);
  animation:bOutGlow 5s ease-in-out infinite;pointer-events:none
}
.bout-halo{
  position:absolute;top:50%;left:50%;width:230px;height:230px;
  border-radius:50%;
  background:conic-gradient(
    from 0deg,transparent 0%,
    rgba(200,126,32,.6) 35%,rgba(224,133,80,.95) 50%,
    rgba(200,126,32,.6) 65%,transparent 100%
  );
  animation:bOutHalo 7s linear infinite;pointer-events:none;
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2px),white calc(100% - 2px));
  mask:radial-gradient(farthest-side,transparent calc(100% - 2px),white calc(100% - 2px))
}
.bout-mark{width:130px;height:130px;position:relative;z-index:2;flex-shrink:0}
.bout-mark svg{width:100%;height:100%;display:block}
.bout-mark.go{animation:bOutMark 1.1s cubic-bezier(.34,1.4,.64,1) .2s both}

.bout-word{
  font-size:5.2rem;font-weight:700;letter-spacing:-.05em;
  position:relative;z-index:2;margin-top:1.1rem;line-height:1;
  background:linear-gradient(140deg,#e8925a 0%,#c25a2c 45%,#e08550 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text
}
.bout-word.go{animation:bOutCopper 1s ease .8s both;opacity:0}

.bout-url{
  font-size:1rem;font-weight:600;color:rgba(255,255,255,.45);
  position:relative;z-index:2;margin-top:.9rem;letter-spacing:.02em
}
.bout-url.go{animation:bOutCopper .8s ease 1.35s both;opacity:0}

.bout-sub{
  font-size:.7rem;text-transform:uppercase;letter-spacing:.18em;
  color:rgba(255,255,255,.18);position:relative;z-index:2;margin-top:.8rem
}
.bout-sub.go{animation:bOutCopper .8s ease 1.7s both;opacity:0}

@media(max-width:900px){
  .p-right,.s-right{display:none}
  .p-left,.s-left{padding:5rem 2rem 3rem 2.5rem!important}
  .p-stat{font-size:5rem}.p-headline{font-size:1.4rem}
  .sol-title{font-size:1.8rem}.hero-brand{font-size:3rem}
  .trans-title{font-size:3rem}.p-deco{font-size:10rem;opacity:.022}
}
</style>
</head>
<body>
<div id="deck" class="dk">

  <div id="prog-wrap"><div id="prog"></div></div>

  <div id="logo-bar">
    <div class="logo">
      <!-- Copper version (light slides) — Gemini mascot paths 1-6 -->

/* ─── ANIMATIONS ─── */
function animCount(el,target,suffix,dur){
  const t0=performance.now();
  const tick=now=>{const p=Math.min((now-t0)/dur,1),ease=1-Math.pow(1-p,3);el.textContent=Math.round(ease*target)+suffix;if(p<1)requestAnimationFrame(tick);};
  requestAnimationFrame(tick);
}

/* Dessin progressif — stroke-drawing animation for brand slides */
function animateBrandDraw(el){
  const svg=el.querySelector('.brand-anim-svg');
  if(!svg)return;
  const grp=svg.querySelector('g');
  if(!grp)return;
  const gradId=svg.querySelector('linearGradient')?.id||'cop-bi';
  // Remove any leftover stroke clone from a previous visit
  const all=svg.querySelectorAll('g');
  if(all.length>1)all[1].remove();
  // Reset fill group
  grp.style.transition='none';
  grp.style.opacity='0';
  grp.setAttribute('fill',`url(#${gradId})`);
  // Clone for stroke layer
  const sg=grp.cloneNode(true);
  grp.parentNode.insertBefore(sg,grp.nextSibling);
  sg.setAttribute('fill','none');
  const paths=[...sg.querySelectorAll('path')];
  paths.forEach(p=>{
    try{
      const len=p.getTotalLength();
      p.setAttribute('stroke','rgba(200,126,32,0.9)');
      p.setAttribute('stroke-width','90');
      p.setAttribute('stroke-linejoin','round');
      p.setAttribute('stroke-linecap','round');
      p.style.strokeDasharray=`${len} ${len}`;
      p.style.strokeDashoffset=`${len}`;
    }catch(e){}
  });
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    paths.forEach((p,i)=>{
      p.style.transition=`stroke-dashoffset 1.4s ease ${i*0.055}s`;
      p.style.strokeDashoffset='0';
    });
  }));
  // Fade in fill, fade out stroke
  setTimeout(()=>{
    grp.style.transition='opacity 0.65s ease';
    grp.style.opacity='1';
    sg.style.transition='opacity 0.65s ease';
    sg.style.opacity='0';
  },1750);
  setTimeout(()=>sg.remove(),2500);
}

function animateIn(idx){
  const s=S[idx],el=slideEls[idx];if(!el)return;
  if(s.t==='brand-in'||s.t==='brand-out'){
    animateBrandDraw(el);
    return;
  }
  if(s.t!=='prob')return;
  if(s.anim){const e=el.querySelector('.p-stat');if(e)animCount(e,s.anim.v,s.anim.s,1600);}
  if(s.chart==='bars') el.querySelectorAll('.tb-fill').forEach(f=>{f.style.transition='none';f.style.width='0';requestAnimationFrame(()=>requestAnimationFrame(()=>{f.style.transition='width 1.3s cubic-bezier(.4,0,.2,1)';f.style.width=f.dataset.pct+'%';}));});
  if(s.chart==='donut'){
    const arc=el.querySelector('.donut-arc'),num=el.querySelector('.donut-num');
    if(arc){arc.style.transition='none';arc.style.strokeDasharray=`0 ${CIRC}`;requestAnimationFrame(()=>requestAnimationFrame(()=>{arc.style.transition='stroke-dasharray 1.6s cubic-bezier(.4,0,.2,1)';const f=(s.data.v/100*CIRC).toFixed(2);arc.style.strokeDasharray=`${f} ${(CIRC-f).toFixed(2)}`;}));}
    if(num)animCount(num,s.data.v,'%',1700);
  }
  if(s.chart==='waste'){
    const u=el.querySelector('.waste-useful'),lo=el.querySelector('.waste-lost');
    if(u){u.style.transition='none';u.style.width='0';requestAnimationFrame(()=>requestAnimationFrame(()=>{u.style.transition='width 1.5s cubic-bezier(.4,0,.2,1)';u.style.width='72%';}));}
    if(lo){lo.style.transition='none';lo.style.width='0';requestAnimationFrame(()=>requestAnimationFrame(()=>{lo.style.transition='width 1.5s .25s cubic-bezier(.4,0,.2,1)';lo.style.width='28%';}));}
  }
  if(s.chart==='compliance') el.querySelectorAll('.cg').forEach(c=>{c.style.opacity='0';c.style.transform='scale(.75)';setTimeout(()=>{c.style.transition='opacity .3s,transform .3s';c.style.opacity='1';c.style.transform='none';},+c.dataset.d);});
}

/* ─── GO ─── */
let cur=0,tmr=null;const DELAY=6500;
function go(idx,dir){
  const n=((idx%S.length)+S.length)%S.length;if(n===cur)return;
  const p=cur;cur=n;const s=S[cur];
  slideEls[p].style.opacity='0';slideEls[p].style.transform=`translateX(${dir<0?40:-40}px)`;slideEls[p].style.pointerEvents='none';
  const c=slideEls[cur];c.style.transition='none';c.style.opacity='0';c.style.transform=`translateX(${dir>0?40:-40}px)`;c.style.pointerEvents='auto';c.offsetHeight;
  c.style.transition='opacity .5s ease,transform .5s ease';c.style.opacity='1';c.style.transform='none';
  document.getElementById('deck').className=s.mode;
  dotEls.forEach((d,i)=>{d.classList.toggle('on',i===cur);d.style.width=i===cur?'18px':'6px';});
  document.getElementById('chap').textContent=s.chap||'';
  document.getElementById('slide-num').textContent=`${cur+1} / ${S.length}`;
  setTimeout(()=>animateIn(cur),120);
  rst();
}

function rst(){
  clearTimeout(tmr);const p=document.getElementById('prog');
  const t=S[cur].t;
  // Brand slides: 5s for intro (let animation play), no auto-advance for outro
  const d=t==='brand-in'?5000:t==='brand-out'?0:DELAY;
  p.style.transition='none';p.style.width='0%';p.offsetHeight;
  if(d>0){p.style.transition=`width ${d}ms linear`;p.style.width='100%';tmr=setTimeout(()=>go(cur+1,1),d);}
  else{p.style.width='0%';}
}

const deck=document.getElementById('deck');
deck.addEventListener('mouseenter',()=>{clearTimeout(tmr);const p=document.getElementById('prog');const w=p.offsetWidth/deck.offsetWidth*100;p.style.transition='none';p.style.width=w+'%';});
deck.addEventListener('mouseleave',rst);
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();go(cur+1,1);}if(e.key==='ArrowLeft'){e.preventDefault();go(cur-1,-1);}});
let tx=null;deck.addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});
deck.addEventListener('touchend',e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>50){dx<0?go(cur+1,1):go(cur-1,-1);}tx=null;});
window._n=()=>go(cur+1,1);window._p=()=>go(cur-1,-1);

/* INIT */
slideEls[0].style.transition='none';slideEls[0].style.opacity='1';slideEls[0].style.transform='none';slideEls[0].style.pointerEvents='auto';
dotEls[0].classList.add('on');dotEls[0].style.width='18px';
document.getElementById('slide-num').textContent=`1 / ${S.length}`;
rst();
</script>
